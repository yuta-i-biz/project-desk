<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="desk-token" content="__CSRF_TOKEN__"><title>案件の現在地 — Project Desk</title><link rel="stylesheet" href="/style.css"><script src="/voice.js" defer></script><script src="/deadlines.js" defer></script><script src="/app.js" defer></script></head>
<body>
<aside class="sidebar"><a href="#" class="brand"><span class="brand-mark">◈</span><span>Project Desk<small>AI WORKSPACE / SHARED MEMORY</small></span></a><div class="nav-caption">ワークスペース</div><nav id="nav"><button class="nav-item" data-view="deadlines"><span>◷</span>期限と遅れ</button><button class="nav-item" data-view="chat"><span>✦</span>チャットと案件</button><button class="nav-item" data-view="overview"><span>◈</span>全体の進み具合</button><button class="nav-item active" data-view="projects"><span>▦</span>案件の現在地</button><button class="nav-item" data-view="tasks"><span>☷</span>タスク一覧<span class="nav-count" id="task-nav-count">0</span></button><button class="nav-item" data-view="unlinked"><span>↗</span>会話・タスクをまとめる<span class="nav-count" id="unlinked-nav-count">0</span></button><button class="nav-item" data-view="results"><span>✦</span>実行結果</button><button class="nav-item" data-view="health"><span>◇</span>不具合の確認</button><button class="nav-item" data-view="history"><span>◷</span>作業の履歴</button></nav><div class="company-head nav-caption">会社・活動</div><div id="companies"></div><div class="sidebar-bottom"><span class="local-dot"></span>このMacで利用中<small>元の案件台帳は変更しません。</small><button id="source-info" class="text-button">接続している情報を見る ↗</button></div></aside>
<main>
<header class="topbar"><div class="breadcrumb">ワークスペース <span>/</span> <strong id="crumb">案件の現在地</strong></div><div class="header-actions"><span id="machine-status" class="machine-status">Mac mini 確認中</span><span id="last-read">読込中</span><button class="icon-button" id="refresh" title="既存の記録を読み直す" aria-label="既存の記録を読み直す">↻</button><button class="primary" id="new-task">✦ AIに依頼</button></div></header>
<div class="page"><div class="page-title"><div><div class="eyebrow">HUMAN × AI · PROJECT CONTROL</div><h1 id="page-title">案件の現在地</h1><p id="page-description">何を進めていて、どこで止まり、次に何をするか。</p></div><div class="title-actions"><button id="new-project" class="secondary">＋ 案件を追加</button><button id="remote-access" class="text-button">別の端末から使う ↗</button></div></div>
<div id="error-banner" role="alert" hidden></div>
<nav class="mobile-nav" aria-label="画面切替"><button data-mobile-view="deadlines">期限と遅れ</button><button data-mobile-view="chat">✦ チャット</button><button data-mobile-view="overview">全体</button><button data-mobile-view="projects">案件</button><button data-mobile-view="tasks">タスク</button><button data-mobile-view="unlinked">未整理</button><button data-mobile-view="results">結果</button><button data-mobile-view="health">点検</button><button data-mobile-view="history">履歴</button><select id="mobile-company" aria-label="会社・活動で絞り込み"></select></nav>
<section id="metrics" class="metrics" aria-label="タスクの状態"></section>
<div class="workspace"><section class="content-panel"><div class="panel-tools"><div id="view-tabs" class="view-tabs"><button data-filter="all" class="selected">すべての案件 <span id="project-count">—</span></button><button data-filter="working">作業中</button><button data-filter="waiting">確認待ち・保留</button></div><label class="search"><span>⌕</span><input id="search" placeholder="案件・タスクを検索" aria-label="案件・タスクを検索"><kbd>⌘ K</kbd></label></div><div id="content" aria-live="polite"><div class="empty">案件の記録を読み込んでいます…</div></div><div class="panel-footer"><span id="visible-count"></span><span>会話の更新 ≠ タスクの進行</span></div></section><aside id="right-rail" class="right-rail"></aside></div>
<footer class="page-footer"><span>会話が分かれても、仕事の続きはここから。</span><span id="coverage">情報の接続を確認中</span></footer></div>
</main>
<div id="toast" role="status" hidden></div>
<dialog id="detail-dialog" class="detail-dialog"><div id="detail"></div></dialog>
<dialog id="form-dialog"><form id="edit-form"><div class="dialog-header"><div><div class="eyebrow">PROJECT DESK</div><h2 id="form-title"></h2></div><button type="button" class="icon-button close-form" aria-label="閉じる">×</button></div><div id="form-fields"></div><div id="form-error" role="alert"></div><div class="form-actions"><button type="button" class="secondary close-form">キャンセル</button><button type="submit" class="primary" id="save-form">保存する</button></div></form></dialog>
</body></html>
